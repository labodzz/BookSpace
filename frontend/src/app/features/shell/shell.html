<div class="shell">
  <aside class="shell-sidebar">
    <div class="shell-sidebar__brand">
      <svg class="shell-sidebar__logo" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M20 4 34 11 20 18 6 11Z" fill="currentColor" opacity="1" />
        <path d="M20 18 34 11V29L20 36Z" fill="currentColor" opacity=".7" />
        <path d="M20 18 6 11V29L20 36Z" fill="currentColor" opacity=".5" />
      </svg>
      <span class="shell-sidebar__wordmark">Book<span class="shell-sidebar__wordmark-accent">Space</span></span>
    </div>

    <nav class="shell-nav">
      <a
        routerLink="/"
        routerLinkActive="shell-nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="shell-nav__link"
      >
        Dashboard
      </a>
      <a routerLink="/resources" routerLinkActive="shell-nav__link--active" class="shell-nav__link">Resources</a>
      <a routerLink="/bookings" routerLinkActive="shell-nav__link--active" class="shell-nav__link">My bookings</a>
      <a routerLink="/calendar" routerLinkActive="shell-nav__link--active" class="shell-nav__link">Calendar</a>
      @if (authService.hasAnyRole('TenantAdmin', 'SysAdmin')) {
        <a routerLink="/users" routerLinkActive="shell-nav__link--active" class="shell-nav__link">Users</a>
      }
      <button type="button" class="shell-nav__link shell-nav__link--disabled" disabled title="Settings are coming soon">
        Settings
      </button>
    </nav>

    @if (authService.currentUser(); as user) {
      <div class="shell-sidebar__footer">
        <div class="shell-sidebar__user">
          <span class="shell-sidebar__user-name">{{ authService.displayName() }}</span>
          <span class="shell-sidebar__user-email">{{ user.email }}</span>
        </div>
        <button type="button" class="shell-sidebar__logout" (click)="logout()">Log out</button>
      </div>
    }
  </aside>

  <main class="shell-content">
    <router-outlet />
  </main>
</div>
