# Local Podman/Docker Compose setup - NOT used in Azure (Azure uses Azure SQL Database, never a SQL
# Server container - see docs/container-deployment.md). Two services: bookspace-db (SQL Server 2022,
# local-only) and bookspace-app (this repo's own Dockerfile, run with ASPNETCORE_ENVIRONMENT=Development
# so the existing dev-only migrate+seed path runs, same as `dotnet run` locally).
#
# Start:  podman compose -f compose.local.yaml up --build -d
# Stop:   podman compose -f compose.local.yaml down            (keeps the database volume)
# Wipe:   podman compose -f compose.local.yaml down -v         (DESTROYS the database volume - see docs)

services:
  bookspace-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - bookspace-sql-data:/var/opt/mssql
    networks:
      - bookspace-net
    # depends_on.condition below already waits for this, but that ordering guarantee isn't identical
    # across every Compose provider/version - see the app's own EnableRetryOnFailure note below, which
    # is what actually makes the app resilient if this healthcheck is ever ignored.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  bookspace-app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # bookspace-db is the other container's *service name* on the shared network below, resolved by
      # Compose's internal DNS - never localhost, which inside this container would mean itself.
      ConnectionStrings__BookSpace: "Server=bookspace-db,1433;Database=BookSpace;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True"
      Auth__Issuer: BookSpace
      Auth__Audience: BookSpace
      Auth__SigningKey: ${AUTH_SIGNING_KEY}
      Auth__AccessTokenMinutes: "15"
      Auth__RefreshTokenDays: "14"
      Cors__AllowedOrigins__0: "http://localhost:8080"
      # Gmail SMTP sender - see docs/background-jobs.md ("Gmail SMTP sender"). Every value here has a
      # safe default (Email__Enabled defaults to "false") so an .env with none of these set still starts
      # the container with email sending disabled, exactly like running `dotnet run` locally with no
      # Email section configured at all.
      Email__Enabled: ${Email__Enabled:-false}
      Email__Provider: ${Email__Provider:-Smtp}
      Email__FromAddress: ${Email__FromAddress:-}
      Email__FromName: ${Email__FromName:-BookSpace}
      Email__Smtp__Host: ${Email__Smtp__Host:-smtp.gmail.com}
      Email__Smtp__Port: ${Email__Smtp__Port:-587}
      Email__Smtp__Security: ${Email__Smtp__Security:-StartTls}
      Email__Smtp__Username: ${Email__Smtp__Username:-}
      Email__Smtp__Password: ${Email__Smtp__Password:-}
    ports:
      - "8080:8080"
    depends_on:
      bookspace-db:
        condition: service_healthy
    networks:
      - bookspace-net

networks:
  bookspace-net:

volumes:
  bookspace-sql-data:
